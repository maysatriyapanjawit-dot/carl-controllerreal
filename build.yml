name: Build Carl Mod JAR

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Build mod
        run: gradle build --stacktrace
      - name: Upload finished mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Carl-Controller-26.3-JAR
          path: build/libs/carl-controller-1.0.1.jar
          if-no-files-found: error
